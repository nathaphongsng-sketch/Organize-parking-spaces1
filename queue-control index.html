<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดคิวรถเข้าคลังสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14213d;--navy2:#1f3157;--gold:#c8962e;--bg:#eef1f6;--card:#fff;--line:#d5dbe6;--ink:#1b2333;--mute:#667085;--ok:#15803d;--okbg:#e7f6ec;--busy:#b42318;--busybg:#fdecea;--stage:#1d4ed8;--wait:#b45309}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Sarabun','Thonburi','Noto Sans Thai',system-ui,sans-serif;font-size:18px}
header{background:var(--navy);color:#fff;border-bottom:5px solid var(--gold);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:800}
header small{color:#c9d3e6;font-size:15px}
.st{display:flex;align-items:center;gap:8px;font-size:15px;color:#c9d3e6}
.dot{width:12px;height:12px;border-radius:50%;background:#4ade80}.dot.off{background:#f59e0b}
main{max-width:1280px;margin:0 auto;padding:18px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-left:6px solid var(--gold)}
.bar label{font-weight:700;font-size:20px}
.bar input{flex:1;min-width:220px;font:inherit;font-size:26px;font-weight:700;padding:10px 14px;border:2px solid var(--line);border-radius:8px;letter-spacing:1px}
.bar input:focus{outline:3px solid #c8962e66;border-color:var(--gold)}
button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 20px;cursor:pointer;min-height:48px}
.b-add{background:var(--navy);color:#fff;font-size:20px;padding:12px 32px}
.b-done{background:var(--ok);color:#fff}.b-edit{background:#e4e8f0;color:var(--ink)}
.b-reset{background:#fff;color:var(--busy);border:2px solid var(--busy)}
.sum{margin-left:auto;display:flex;gap:18px;font-size:16px;color:var(--mute)}.sum b{color:var(--ink);font-size:20px}
section{margin-top:20px}
section h2{font-size:22px;font-weight:800;color:var(--navy);display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
section h2 span{font-size:15px;font-weight:400;color:var(--mute)}
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.slot{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--line);border-radius:10px;padding:12px 14px;min-height:150px;display:flex;flex-direction:column;gap:8px}
.slot .no{font-size:17px;font-weight:700;color:var(--mute)}
.slot .plate{font-size:30px;font-weight:800;letter-spacing:1px;word-break:break-all}
.slot .empty{font-size:20px;color:#98a2b3;margin:auto 0}
.slot .act{display:flex;gap:8px;margin-top:auto}.slot .act button{flex:1;padding:10px 6px}
.z-g .slot{border-top-color:var(--ok)}.z-g .slot.full{border-top-color:var(--busy);background:#fffafa}
.z-s .slot.full{border-top-color:var(--stage)}.z-w .slot.full{border-top-color:var(--wait)}
.tag{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.full .tag{background:var(--busybg);color:var(--busy)}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#md.on{display:flex}
.box{background:#fff;border-radius:12px;padding:22px;width:min(440px,100%);border-top:6px solid var(--gold)}
.box p{font-size:20px;font-weight:700;margin-bottom:12px}
.box input{width:100%;font:inherit;font-size:26px;font-weight:700;padding:10px;border:2px solid var(--line);border-radius:8px;margin-bottom:14px}
.box .r{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:8px;font-size:18px;display:none;z-index:10}
@media(max-width:820px){.g3,.g6{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.sum{margin-left:0}}
</style>
</head>
<body>
<header>
  <div><h1>ระบบจัดคิวรถเข้าคลังสินค้า</h1><small>หน้าจอเจ้าหน้าที่ • บันทึกและจัดลำดับอัตโนมัติ</small></div>
  <div class="st"><span class="dot" id="dot"></span><span id="stx">กำลังเชื่อมต่อ</span></div>
</header>
<main>
  <div class="bar">
    <label for="plate">ทะเบียนรถ</label>
    <input id="plate" placeholder="เช่น 1กก 1234" autocomplete="off">
    <button class="b-add" id="add">บันทึกรถเข้าคิว</button>
    <div class="sum"><span>ในคิวทั้งหมด <b id="cnt">0</b> คัน</span></div>
    <button class="b-reset" id="reset">รีเซ็ตทั้งหมด</button>
  </div>
  <section class="z-g"><h2>ประตู <span>รถที่กำลังเข้าจัดของ</span></h2><div class="grid g3" id="zg"></div></section>
  <section class="z-s"><h2>พื้นที่จัดของ <span>รอเข้าประตู เรียงตามลำดับ</span></h2><div class="grid g6" id="zs"></div></section>
  <section class="z-w"><h2>พื้นที่รอ <span>รอเข้าพื้นที่จัดของ</span></h2><div class="grid g4" id="zw"></div></section>
</main>
<div id="md"><div class="box"><p id="mp"></p><input id="mi"><div class="r"><button class="b-edit" id="mc">ยกเลิก</button><button class="b-add" id="mo">ตกลง</button></div></div></div>
<div id="toast"></div>
<script>
/* ===== ตั้งค่าการซิงก์ข้ามเครื่อง (ไม่บังคับ) =====
   ใส่ URL ของ Firebase Realtime Database เช่น 'https://ชื่อโปรเจกต์-default-rtdb.firebaseio.com'
   ต้องใส่ค่าเดียวกันทั้ง 2 ไฟล์ ถ้าเว้นว่างจะซิงก์เฉพาะในเครื่อง/เบราว์เซอร์เดียวกัน */
const DB_URL='';
const KEY='yard_queue_v1',MAXS=6,MAXW=4;
let S={g:[null,null,null],s:[],w:[]};
const $=i=>document.getElementById(i);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(){for(let k=0;k<2;k++){
  for(let i=0;i<3;i++)if(!S.g[i]&&S.s.length)S.g[i]=S.s.shift();
  while(S.s.length<MAXS&&S.w.length)S.s.push(S.w.shift());}}
function all(){return [...S.g,...S.s,...S.w].filter(Boolean)}
/* ---- ซิงก์ ---- */
const bc='BroadcastChannel' in window?new BroadcastChannel(KEY):null;
function setSt(ok,t){$('dot').className='dot'+(ok?'':' off');$('stx').textContent=t}
function save(){const j=JSON.stringify(S);
  try{localStorage.setItem(KEY,j)}catch(e){}
  if(bc)bc.postMessage(j);
  if(DB_URL)fetch(DB_URL+'/queue.json',{method:'PUT',body:JSON.stringify(j)}).then(()=>setSt(true,'ออนไลน์ • ซิงก์สด')).catch(()=>setSt(false,'ส่งข้อมูลไม่สำเร็จ'));}
function apply(j){try{const d=JSON.parse(j);if(d&&d.g&&d.s&&d.w){S=d;render()}}catch(e){}}
function update(fn){fn();norm();render();save()}
if(bc)bc.onmessage=e=>apply(e.data);
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)apply(e.newValue)});
if(DB_URL){const es=new EventSource(DB_URL+'/queue.json');
  es.addEventListener('put',e=>{const d=JSON.parse(e.data);setSt(true,'ออนไลน์ • ซิงก์สด');if(typeof d.data==='string')apply(d.data)});
  es.onerror=()=>setSt(false,'เชื่อมต่อไม่ได้ กำลังลองใหม่');
}else setSt(true,'โหมดในเครื่องนี้');
/* ---- แสดงผล ---- */
function slot(z,i,it,label){
  if(!it)return `<div class="slot"><div class="no">${label} ${i+1}</div><div class="empty">ว่าง</div></div>`;
  return `<div class="slot full"><div class="no">${label} ${i+1} <span class="tag">${z==='g'?'ไม่ว่าง':'มีรถ'}</span></div><div class="plate">${esc(it.p)}</div>
  <div class="act"><button class="b-done" data-a="done" data-z="${z}" data-i="${i}">เสร็จสิ้น</button><button class="b-edit" data-a="edit" data-z="${z}" data-i="${i}">แก้ไข</button></div></div>`}
function render(){
  $('zg').innerHTML=S.g.map((x,i)=>slot('g',i,x,'ประตู')).join('');
  $('zs').innerHTML=Array.from({length:MAXS},(_,i)=>slot('s',i,S.s[i],'ลำดับ')).join('');
  $('zw').innerHTML=Array.from({length:MAXW},(_,i)=>slot('w',i,S.w[i],'รอ')).join('');
  $('cnt').textContent=all().length}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
/* ---- ป๊อปอัป ---- */
let mcb=null;
function ask(msg,val,cb){$('mp').textContent=msg;const i=$('mi');i.style.display=val===null?'none':'block';i.value=val||'';mcb=cb;$('md').classList.add('on');if(val!==null)setTimeout(()=>i.focus(),50)}
$('mc').onclick=()=>$('md').classList.remove('on');
$('mo').onclick=()=>{const v=$('mi').value.trim();$('md').classList.remove('on');if(mcb)mcb(v)};
$('mi').onkeydown=e=>{if(e.key==='Enter')$('mo').click()};
/* ---- การทำงาน ---- */
function addPlate(){
  const p=$('plate').value.trim();if(!p){toast('กรุณากรอกทะเบียนรถ');return}
  if(all().some(x=>x.p===p)){toast('ทะเบียนนี้อยู่ในคิวแล้ว');return}
  const gi=S.g.findIndex(x=>!x);
  if(gi<0&&S.s.length>=MAXS&&S.w.length>=MAXW){toast('คิวเต็มทุกพื้นที่แล้ว');return}
  update(()=>{const it={p,t:Date.now()};
    if(gi>=0)S.g[gi]=it;else if(S.s.length<MAXS)S.s.push(it);else S.w.push(it)});
  $('plate').value='';$('plate').focus();toast('บันทึกทะเบียน '+p+' แล้ว')}
$('add').onclick=addPlate;
$('plate').onkeydown=e=>{if(e.key==='Enter')addPlate()};
$('reset').onclick=()=>ask('ต้องการลบทะเบียนรถทั้งหมดและเริ่มใหม่ใช่หรือไม่?',null,()=>update(()=>{S={g:[null,null,null],s:[],w:[]}}));
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;
  const z=b.dataset.z,i=+b.dataset.i,arr=S[z],it=arr[i];
  if(b.dataset.a==='done')update(()=>{if(z==='g')S.g[i]=null;else arr.splice(i,1)});
  else ask('แก้ไขทะเบียนรถ',it.p,v=>{if(v&&v!==it.p)update(()=>{it.p=v})})});
/* ---- เริ่มต้น ---- */
try{const j=localStorage.getItem(KEY);if(j)apply(j)}catch(e){}
render();
</script>
</body>
</html>
